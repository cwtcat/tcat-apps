server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # For client-side routing: if file not found, serve index.html
  location / {
    try_files $uri /index.html;
  }

  # (Optional) Static asset tweaks
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    access_log off;
  }
}
