version: "3.9"

services:
  tcat_app:
    build:
      context: .
    image: tcat-app:latest
    restart: unless-stopped
    expose:
      - "80"  # internal only; do NOT publish host ports
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tcatapp.rule=Host(`tcat-app.convergentcode.com`)"
      - "traefik.http.routers.tcatapp.entrypoints=web,websecure"
      - "traefik.http.routers.tcatapp.tls.certresolver=le"
      - "traefik.http.services.tcatapp.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    external: true
