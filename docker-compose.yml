services:
  landing_hub:
    build: .
    image: landing-hub:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Root path only (exclude /dashboard prefix)
      - "traefik.http.routers.landinghub.rule=Host(`tcat.convergentcode.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.landinghub.priority=10"                # Lower priority than /dashboard route
      - "traefik.http.routers.landinghub.entrypoints=web,websecure"
      - "traefik.http.routers.landinghub.tls.certresolver=le"
      - "traefik.http.services.landinghub.loadbalancer.server.port=80"
      - "traefik.http.routers.landinghub.middlewares=office-whitelist@file"  # optional IP restriction
    networks:
      - web

networks:
  web:
    external: true