version: "3.9"

services:
  tcat_app:
    build: .
    image: tcat-app:latest
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # ROUTER: only match this app when path begins with /apps/ridership
      - "traefik.http.routers.tcatapp.rule=Host(`tcat.convergentcode.com`) && PathPrefix(`/apps/ridership`)"

      # HTTPS / Certs
      - "traefik.http.routers.tcatapp.entrypoints=websecure"
      - "traefik.http.routers.tcatapp.tls.certresolver=le"

      # PRIORITY: Must be higher than landing page
      - "traefik.http.routers.tcatapp.priority=100"

      # MIDDLEWARE: Strip /apps/ridership so nginx sees "/"
      - "traefik.http.middlewares.ridership-strip.stripprefix.prefixes=/apps/ridership"
      - "traefik.http.routers.tcatapp.middlewares=ridership-strip"

      # SERVICE PORT: Nginx inside container is listening on 80
      - "traefik.http.services.tcatapp.loadbalancer.server.port=80"

    networks:
      - web

    volumes:
      - /opt/tcat-apps/dist:/usr/share/nginx/html:ro

networks:
  web:
    external: true
